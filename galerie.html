<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FILIP LIŠKA | Portfolio</title>

  <!-- FONTY -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Anton&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --brand: #fe6d11;
      --black: #000;
      --white: #fff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      background: var(--black);
      color: var(--white);
      font-family: 'Bebas Neue', sans-serif;
      scroll-behavior: smooth;
      overflow-x: hidden;
    }

    /* --- MENU TOGGLE --- */
    :root {
  --brand: #fe6d11;
  --black: #000;
  --white: #fff;
}

/* --- MENU TOGGLE --- */
.menu-toggle {
  position: fixed;
  top: 18px;
  right: 16px;
  z-index: 20;
  width: 44px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  background: transparent;
  border: 0;
}

.menu-toggle .hamburger,
.menu-toggle .hamburger::before,
.menu-toggle .hamburger::after {
  content: "";
  display: block;
  background: var(--white);
  height: 3px;
  width: 26px;
  border-radius: 2px;
  transition: transform .25s ease, background .25s ease, opacity .25s ease;
}

.menu-toggle .hamburger {
  position: relative;
}

.menu-toggle .hamburger::before {
  position: absolute;
  top: -8px;
}

.menu-toggle .hamburger::after {
  position: absolute;
  top: 8px;
}

/* --- Stav při otevření menu --- */
.full-menu.open ~ .menu-toggle .hamburger {
  background: transparent;
}
.full-menu.open ~ .menu-toggle .hamburger::before {
  transform: rotate(45deg);
  top: 0;
  background: #000;
}
.full-menu.open ~ .menu-toggle .hamburger::after {
  transform: rotate(-45deg);
  top: 0;
  background: #000;
}

/* --- FULLSCREEN MENU --- */
.full-menu {
  position: fixed;
  inset: 0;
  background: var(--brand);
  color: #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  transform: translateY(-100%);
  transition: transform .45s ease-in-out;
  z-index: 15;
  padding: 96px 24px 32px;
}

.full-menu.open {
  transform: translateY(0);
}

.menu-content {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  margin-top: 6vh;
}

.menu-content a {
  font-family: 'Bebas Neue', sans-serif;
  text-decoration: none;
  color: #000;
  text-transform: uppercase;
  font-size: clamp(40px, 9vw, 96px);
  transition: color .2s ease;
  letter-spacing: 0.03em;
  text-align: center;
}

.menu-content a:hover {
  color: #fff;
}

.social-links {
  display: flex;
  gap: 28px;
  padding: 8px 0 6px;
}

.social-links a {
  color: #000;
  font-size: 28px;
  transition: color .2s;
}

.social-links a:hover {
  color: #fff;
}

/* --- 📱 Mobilní verze (tablety, mobily) --- */
@media (max-width: 768px) {
  .menu-toggle {
    top: 12px;
    right: 14px;
    width: 36px;
    height: 28px;
  }

  .menu-toggle .hamburger,
  .menu-toggle .hamburger::before,
  .menu-toggle .hamburger::after {
    width: 22px;
    height: 2px;
  }

  .full-menu {
    padding: 70px 20px 24px;
    justify-content: space-evenly;
  }

  .menu-content {
    margin-top: 10vh;
    gap: 6px;
  }

  .menu-content a {
    font-size: clamp(32px, 11vw, 60px);
  }

  .social-links {
    gap: 20px;
  }

  .social-links a {
    font-size: 24px;
  }
}

/* --- 📱 Extra malé telefony (iPhone SE apod.) --- */
@media (max-width: 420px) {
  .menu-toggle {
    top: 10px;
    right: 10px;
    width: 32px;
    height: 24px;
  }

  .menu-toggle .hamburger,
  .menu-toggle .hamburger::before,
  .menu-toggle .hamburger::after {
    width: 20px;
    height: 2px;
  }

  .menu-content a {
    font-size: clamp(26px, 12vw, 48px);
  }

  .full-menu {
    padding: 60px 14px 20px;
  }
}
    /* --- SEKCE PORTFOLIO --- */
    .section-portfolio {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
      overflow: hidden;
    }

    .section-portfolio .gradient-text {
      font-size: 12rem;
      color: var(--brand);
      letter-spacing: 4px;
      text-align: center;
      opacity: 0;
      animation: fadeIn 1s ease-out forwards;
    }
    @media (max-width: 768px) {
  .section-portfolio .gradient-text {
    font-size: 6rem; /* 📱 na telefonech menší */
  }
}

@media (max-width: 480px) {
  .section-portfolio .gradient-text {
    font-size: 4rem; /* 📱📱 na velmi malých telefonech ještě menší */
  }
}

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- ACCORDEONY --- */
    .section-accordions {
      position: relative;
      background: #000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 100px 0 80px;
      overflow: hidden;
    }

    /* --- Oranžové čáry pouze v této sekci --- */
    .section-accordions::before,
    .section-accordions::after {
      content: "";
      position: absolute;
      left: 0;
      width: 100%;
      height: 5px;
      background: var(--brand);
    }

    .section-accordions::before {
      top: 0;
    }

    .section-accordions::after {
      bottom: 0;
    }

    /* ACCORDEON STYL */
    .accordion {
      width: 100%;
      position: relative;
      z-index: 10;
    }

    .accordion-item {
      border-bottom: 3px solid #111;
      overflow: hidden;
    }

    .accordion-header {
      width: 100%;
      background: #000;
      color: var(--brand);
      text-align: left;
      padding: 20px 40px;
      font-size: 36px;
      border: none;
      cursor: pointer;
      transition: background 0.3s ease, color 0.3s ease;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Bebas Neue', sans-serif;
    }

    .accordion-header::after {
      content: "+";
      font-size: 32px;
      color: var(--brand);
      transition: transform 0.3s ease;
    }

    .accordion-item.active .accordion-header::after {
      content: "−";
      transform: rotate(180deg);
    }

    .accordion-header:hover {
      background: #111;
      color: #fff;
    }

    .accordion-content {
      max-height: 0;
      overflow: hidden;
      background: #000;
      padding: 0 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      transition: max-height 0.8s cubic-bezier(0.25, 1, 0.3, 1), opacity 0.6s ease;
      opacity: 0;
    }

    .accordion-item.active .accordion-content {
      opacity: 1;
      max-height: 1200px;
    }

    /* OBSAH */
    .portfolio-track {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
    }

    .portfolio-item {
      width: 320px;
      background: #111;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .portfolio-item:hover { transform: translateY(-5px); }

    .portfolio-item img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
    }

    .portfolio-item p {
      margin: 15px 0;
      font-size: 16px;
      color: #ccc;
    }

    .rounded-button {
      display: inline-block;
      padding: 8px 20px;
      border: 2px solid white;
      border-radius: 20px;
      background-color: transparent;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .rounded-button:hover {
      background-color: white;
      color: black;
      transform: scale(1.05);
    }

    .video-track {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
    }

    .video-item {
      width: 80%;
      max-width: 900px;
      text-align: center;
    }

    .video-item iframe {
      width: 100%;
      height: 400px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .video-item p {
      margin-top: 10px;
      font-size: 20px;
      color: var(--brand);
    }
  </style>
</head>

  <script>
    const toggle = document.getElementById('menuToggle');
    const menu = document.getElementById('fullMenu');
