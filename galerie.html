    <style>
/* ===========================
  ZÁKLADNÍ STYL
=========================== */
body {
  overflow-x: hidden;
  background-color: #000;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* ===========================
  NAVBAR
=========================== */
.navbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background-color: #000;
  padding: 10px 40px;
  position: relative;
  z-index: 1000;
  flex-wrap: wrap;
}

.logo img {
  width: 80px;
  height: auto;
  transition: transform 0.4s ease-in-out;
}

.logo img:hover {
  transform: scale(1.1);
}

.center-nav {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 70px;
}

.center-nav a {
  position: relative;
  color: white;
  text-decoration: none;
  font-size: 17px;
  padding-bottom: 5px;
}

.center-nav a::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: 0;
  height: 2px;
  width: 0;
  background-color: #fe6d11;
  transition: width 0.4s ease;
}

.center-nav a:hover::after {
  width: 100%;
}

/* ===========================
  GRADIENT SEKCIA
=========================== */
.gradient-section {
  position: relative;
  display: flex;
  justify-content: center;   /* Horizontálně na střed */
  align-items: center;       /* Vertikálně na střed */
  height: 100vh;             /* Výška na celou obrazovku */
  text-align: center;        /* Zarovnání textu na střed */
  padding: 0 20px;           /* Menší mezery po stranách pro menší displeje */
}

.gradient-text {
  font-size: 12rem; /* uprav si podle potřeby */
  background-color: #fe6d11;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-family: 'Bebas Neue', sans-serif;
  letter-spacing: 4px;
  text-align: center;
  line-height: 1;
  opacity: 0;
  animation: fadeIn 1s ease-out forwards;
}


@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  } to {
    opacity: 1;
    transform: translateY(0);
  }
}
/* ===========================
  MENU TOGGLE
=========================== */
.menu-toggle {
  position: absolute;
  top: 20px;
  right: 40px;
  font-size: 32px;
  cursor: pointer;
  z-index: 1001;
  color: white;   /* na stránce bude bílé */
  transition: color 0.3s ease;
}

/* když je menu otevřené, tlačítko bude černé */
.full-menu.open ~ .menu-toggle,
.full-menu.open + .menu-toggle {
  color: black;
}

.full-menu {
  position: fixed;
  top: -100%;
  left: 0;
  width: 100%;
  height: 100%;
  background: #fe6d11;
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  transition: top 0.6s ease-in-out;
  z-index: 1000;
  padding: 0;
}

.full-menu.open {
  top: 0;
}

.full-menu .close-btn {
  position: absolute;
  top: 30px;
  right: 40px;
  background: none;
  border: none;
  font-size: 36px;
  color: white;
  cursor: pointer;
}

.menu-wrapper {
  flex: 1;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: 20vh;
}

.menu-content h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 100px;
  font-weight: 400;
  margin: 25px 0;
  text-transform: uppercase;
  text-align: center;
}

.menu-content h1 a {
  color: black;
  text-decoration: none;
  transition: color 0.3s ease;
}

.menu-content h1 a:hover {
  color: white;
}

.social-links {
  padding-bottom: 20px;
  display: flex;
  gap: 25px;
  justify-content: center;
}

.social-links a {
  color: black;
  font-size: 28px;
  transition: color 0.3s ease;
}

.social-links a:hover {
  color: white;
}


/* ===========================
  VIDEO KNIHOVNA
=========================== */
.video-library {
  background-color: black;
  padding: 60px 40px;
  position: relative;
  overflow: hidden;
  border-top: 5px solid #fe6d11;
  border-bottom: 5px solid #fe6d11;
  color: white;
  text-align: center;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.video-library h2 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 48px;
  margin-bottom: 40px;
  color: #fe6d11;
}

.video-carousel {
  overflow-x: auto;
  white-space: nowrap;
  scroll-behavior: smooth;
  margin: auto 0;
}

.video-track {
  display: inline-flex;
  gap: 30px;
  padding: 10px;
}

.video-item {
  width: 360px;
  flex-shrink: 0;
  display: inline-block;
}

.video-item iframe {
  width: 100%;
  height: 200px;
  border-radius: 8px;
}

.video-item p {
  margin-top: 10px;
  font-size: 16px;
  color: #ccc;
}

/* ===========================
  TABLET
=========================== */
@media (max-width: 992px) {
  .gradient-text {
    font-size: 3rem;
    margin-top: -120px;
  }

  .center-nav {
    gap: 40px;
  }
}

/* ===========================
  MOBIL
=========================== */
@media (max-width: 576px) {
  .navbar {
    flex-direction: column;
    align-items: flex-start;
    padding: 10px 20px;
  }

  .center-nav {
    position: static;
    flex-direction: column;
    gap: 20px;
    transform: none;
    margin-top: 10px;
    align-items: flex-start;
  }

  .logo img {
    width: 60px;
  }

  .gradient-text {
    font-size: 2rem;
    text-align: center;
    padding: 0 20px;
    padding-top: 120px;
  }

  footer {
    font-size: 12px;
    padding: 8px 15px;
  }

  .rounded-button {
    padding: 4px 12px;
    font-size: 10px;
  }

  .menu-content h1 {
    font-size: 48px;
  }

  .video-library {
    padding: 40px 20px;
  }

  .video-item {
    width: 260px;
  }

  .video-item iframe {
    height: 150px;
  }
}
/* ===========================
  PORTFOLIO SEKCIA

.portfolio-item {

  background: #111;
  border-radius: 12px;
  padding: 15px;
  text-align: center;
  transition: transform 0.3s ease;
}

.portfolio-item:hover {
  transform: translateY(-5px);
}

.portfolio-item img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 8px;
}

.portfolio-item p {

/* ===========================
  ACCORDION
=========================== */
.accordion {
  border-top: 5px solid #fe6d11;
  border-bottom: 5px solid #fe6d11;
}

.accordion-item {
  border-bottom: 3px solid #111;
}

.accordion-header {
  width: 100%;
  background: #000;
  color: #fe6d11;
  text-align: left;
  padding: 20px 40px;
  font-size: 36px;
  font-family: 'Bebas Neue', sans-serif;
  border: none;
  cursor: pointer;
  transition: background 0.3s ease, color 0.3s ease;
  text-transform: uppercase;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.accordion-header::after {
  content: "+";
  font-size: 32px;
  color: #fe6d11;
  transition: transform 0.3s ease;
}

.accordion-item.active .accordion-header::after {
  content: "−";
  transform: rotate(180deg);
}

.accordion-header:hover {
  background: #111;
  color: #fff;
}

.accordion-content {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.6s ease, padding 0.3s ease;
  background: #000;
  padding: 0 40px;
  display: flex;                /* dělá z obsahu flexbox */
  flex-direction: column;       /* videa pod sebou */
  align-items: center;          /* zarovná je doprostřed */
  gap: 40px;                    /* mezera mezi videi */
}

.accordion-item.active .accordion-content {
  max-height: 2000px; /* aby se to rozbalilo i pro víc videí */
  padding: 40px;      /* větší okraj kolem videí */
}
.accordion .video-item {
  width: 80%;           /* video nebude přes celou šířku */
  max-width: 900px;     /* ale nepřesáhne 900px */
  text-align: center;   /* zarovnání popisku doprostřed */
}

/* aby videa vypadala stejně jako v původní .video-library */
.accordion .video-item iframe {
  width: 100%;
  height: 400px;       /* větší výška videa */
  border-radius: 12px;
  box-shadow: 0 0 20px rgba(0,0,0,0.5); /* decentní stín */
}
.accordion .video-item p {
  margin-top: 10px;
  font-size: 20px;
  color: #fe6d11;
  font-family: 'Bebas Neue', sans-serif;
}



    </style>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Kliknutí na box
    document.querySelectorAll(".box[data-expandable='true']").forEach(box => {
      box.addEventListener("click", function (e) {
        e.stopPropagation();
        expandBox(this);
      });
    });

    // Kliknutí na zpět
    document.querySelectorAll(".close-btn-inside").forEach(btn => {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        resetView();
      });
    });

    // Accordion – musí být taky uvnitř DOMContentLoaded
    document.querySelectorAll(".accordion-header").forEach(header => {
      header.addEventListener("click", () => {
        header.parentElement.classList.toggle("active");
      });
    });
  });

  function expandBox(clickedBox) {
    // Reset stavu
    resetView();

    // Rozbalení daného boxu
    clickedBox.classList.add("expanded");

    // Skrytí ostatních
    document.querySelectorAll(".box").forEach(box => {
      if (box !== clickedBox) {
        box.style.display = "none";
      }
    });
  }

  function resetView() {
    // Vrácení všech boxů do výchozího stavu
    document.querySelectorAll(".box").forEach(box => {
      box.classList.remove("expanded");
      box.style.display = "flex"; // obnoví zobrazení všech boxů
    });
  }

  function toggleMenu() {
    const menu = document.getElementById('fullMenu');
    menu.classList.toggle('open');
  }
</script>
