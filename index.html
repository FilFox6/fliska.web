<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filip Liška – Tvůrce videa & Specialista na sociální média</title>
    <meta name="description" content="Tvůrce videa, střihač a marketingový specialista specializující se na krátký obsah, dynamický střih a sociální média." />
    <meta name="author" content="Filip Liška" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="index.css">

    <meta property="og:title" content="Filip Liška – Tvůrce videa" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>

    <button class="menu-toggle" id="menuToggle" aria-label="Menu">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>

    <nav class="menu" id="menuOverlay">
      <ul class="menu-list">
        <li><a href="index.html" class="menu-link">Home</a></li>
        <li><a href="portfolio.html" class="menu-link">Portfolio</a></li>
        <li><a href="about.html" class="menu-link">About</a></li>
        <li><a href="contact.html" class="menu-link">Contact</a></li>
      </ul>
    </nav>

    <main class="main-content">
      
      <section id="home" class="hero">
        <h1 class="hero-title">FILIP LIŠKA</h1>
        <p class="hero-subtitle">Content Creator & Social Media Junior</p>
        <div class="hero-cta">
          <a href="portfolio.html" class="btn btn-primary">Moje práce</a>
          <a href="contact.html" class="btn btn-secondary">Kontakt</a>
        </div>
      </section>


    </main>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const menuToggle = document.getElementById('menuToggle');
        const menu = document.getElementById('menuOverlay');
        const menuLinks = document.querySelectorAll('.menu-link');
      
        // Přepínání menu (Open/Close)
        menuToggle.addEventListener('click', function() {
          menuToggle.classList.toggle('open');
          menu.classList.toggle('open');
          
          if (menu.classList.contains('open')) {
            document.body.style.overflow = 'hidden';
          } else {
            document.body.style.overflow = '';
          }
        });
      
        // Zavření po kliknutí na link
        menuLinks.forEach(function(link) {
          link.addEventListener('click', function() {
            menuToggle.classList.remove('open');
            menu.classList.remove('open');
            document.body.style.overflow = '';
          });
        });
      
        // Zavření klávesou Esc
        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape' && menu.classList.contains('open')) {
            menuToggle.classList.remove('open');
            menu.classList.remove('open');
            document.body.style.overflow = '';
          }
        });
      });
    </script>
  </body>
</html>
