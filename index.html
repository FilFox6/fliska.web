<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FILIP LIŠKA</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="icon" type="image/png" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/Geometrická hlava lišky.png" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: 'Bebas Neue', sans-serif;
      background: url('ja3.JPG') no-repeat center center fixed;
      background-size: cover;
      color: #fe6d11;
    }

    .menu-toggle {
  position: absolute;
  top: 20px;
  right: 40px;
  font-size: 32px;
  cursor: pointer;
  z-index: 1001;
  color: black;
}

.full-menu {
  position: fixed;
  top: -100%;
  left: 0;
  width: 100%;
  height: 100%;
  background: #fe6d11;
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: space-between;   /* rozdělí obsah a social */
  align-items: center;
  transition: top 0.6s ease-in-out;
  z-index: 1000;
  padding: 60px 0;                  /* aby nebylo nalepené */
}

.full-menu.open {
  top: 0;
}

.full-menu .close-btn {
  position: absolute;
  top: 30px;
  right: 40px;
  background: none;
  border: none;
  font-size: 36px;
  color: white;
  cursor: pointer;
}

/* Obalovací div pro zarovnání odkazů na střed */
.menu-wrapper {
  flex: 1;
  display: flex;
  align-items: center;   /* vertikálně na střed */
}

.menu-content h1 {
  font-size: 80px;
  margin: 20px 0;
}

.menu-content h1 a {
  color: black;
  text-decoration: none;
  transition: color 0.3s ease;
}

.menu-content h1 a:hover {
  color: white;
}

.social-links {
  padding-bottom: 40px;
  display: flex;
  gap: 30px;
  justify-content: center;
}

.social-links a {
  color: black;
  font-size: 36px;
  transition: color 0.3s ease;
}

.social-links a:hover {
  color: white;
}


    .title {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 2;
      width: 100%;
      padding: 0 10px;
    }

    .title h1 {
      font-size: 12em;
      line-height: 0.9;
      white-space: nowrap;
      animation: fadeIn 1s ease-out forwards;
    }
    @keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  } to {
    opacity: 1;
    transform: translateY(0);
  }
}

    @media (max-width: 1200px) {
      .title h1 {
        font-size: 8em;
      }
      .menu-content h1 {
        font-size: 60px;
      }
    }

    @media (max-width: 768px) {
      .title h1 {
        font-size: 5em;
      }
      .menu-content h1 {
        font-size: 50px;
      }
    }

    @media (max-width: 480px) {
      .title h1 {
        font-size: 3.5em;
        white-space: normal;
      }
      .menu-toggle {
        top: 15px;
        right: 20px;
        font-size: 28px;
      }
      .full-menu .close-btn {
        top: 15px;
        right: 20px;
        font-size: 28px;
      }
      .menu-content h1 {
        font-size: 48px;
      }
    }
    
  </style>
</head>
<body>

  <!-- === MENU === -->
  <div class="menu-toggle" onclick="document.getElementById('fullMenu').classList.toggle('open')">☰</div>
  <div class="full-menu" id="fullMenu">
    <div class="menu-content">
      <h1><a href="index.html">HLAVNÍ</a></h1>
      <h1><a href="galerie.html">PORTFOLIO</a></h1>
      <h1><a href="kurz.html">SNOWBOARDING</a></h1>
      <h1><a href="Board.html">OVERVIEW</a></h1>
    </div>
      <!-- Sociální sítě -->
  <div class="social-links">
    <a href="https://www.facebook.com/" target="_blank"><i class="fab fa-facebook-f"></i></a>
    <a href="https://www.instagram.com/" target="_blank"><i class="fab fa-instagram"></i></a>
    <a href="https://www.youtube.com/" target="_blank"><i class="fab fa-youtube"></i></a>
  </div>
  </div>

  <!-- === TITLE === -->
  <div class="title">
    <h1>FILIP LIŠKA</h1>
  </div>

</body>
</html>
